name: Actualizar la Copa de Reseñas

on:
  schedule:
    # GitHub atrasa o saltea los horarios en punto: se usan minutos sueltos y varios respaldos.
    # Si ya se actualizó en el día, los respaldos no hacen nada.
    - cron: "7 13 * * *" # 10:07 h de Argentina
    - cron: "37 13 * * *" # 10:37 h
    - cron: "13 14 * * *" # 11:13 h
    - cron: "43 15 * * *" # 12:43 h
    - cron: "19 19 * * *" # 16:19 h
  push: # cuando se cambia el código o la configuración, se actualiza en el momento
    branches: [main]
    paths: ["scripts/**", "config.json", "marca/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      completa:
        description: "Releer todas las reseñas desde el inicio"
        type: boolean
        default: false

permissions:
  contents: write
  models: read

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # lo último, aunque la corrida haya esperado en la fila
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Traer y analizar las reseñas
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENTO: ${{ github.event_name == 'push' && 'workflow_dispatch' || github.event_name }}
          COMPLETA: ${{ inputs.completa }}
        run: node scripts/actualizar.mjs
      - name: Publicar
        run: |
          git config user.name "copa-resenas"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Actualización $(TZ=America/Argentina/Buenos_Aires date '+%d/%m %H:%M')"
          git pull --rebase origin main
          git push
